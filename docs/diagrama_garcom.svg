<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" width="820" height="520" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="820" height="520" fill="#ffffff"/>
  <text x="410" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Agente B — Garçom</text>

  <!-- Início -->
  <circle cx="40" cy="185" r="9" fill="#333"/>
  <line x1="49" y1="185" x2="98" y2="185" stroke="#333" stroke-width="2" marker-end="url(#seta)"/>

  <!-- Estados -->
  <rect x="100" y="150" width="210" height="70" rx="14" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2"/>
  <text x="205" y="191" text-anchor="middle" font-size="17" font-weight="bold" fill="#4a148c">AnotandoPedido</text>

  <rect x="510" y="150" width="210" height="70" rx="14" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="615" y="191" text-anchor="middle" font-size="17" font-weight="bold" fill="#0d47a1">AguardandoPrato</text>

  <rect x="305" y="400" width="210" height="70" rx="14" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
  <text x="410" y="441" text-anchor="middle" font-size="17" font-weight="bold" fill="#bf360c">ServindoPrato</text>

  <!-- AnotandoPedido -> AguardandoPrato -->
  <line x1="310" y1="185" x2="508" y2="185" stroke="#333" stroke-width="2" marker-end="url(#seta)"/>
  <text x="410" y="175" text-anchor="middle" font-size="13" fill="#222">tempoNaMesa ≥ 2</text>
  <text x="410" y="205" text-anchor="middle" font-size="12" fill="#6a1b9a">saída: balcão.colocarPedido()</text>

  <!-- AguardandoPrato -> ServindoPrato -->
  <line x1="600" y1="220" x2="480" y2="398" stroke="#333" stroke-width="2" marker-end="url(#seta)"/>
  <text x="560" y="320" font-size="13" fill="#222">balcão.temPrato()</text>
  <text x="560" y="337" font-size="12" fill="#1565c0">(prato do cozinheiro)</text>

  <!-- ServindoPrato -> AnotandoPedido -->
  <line x1="340" y1="400" x2="220" y2="222" stroke="#333" stroke-width="2" marker-end="url(#seta)"/>
  <text x="120" y="320" font-size="13" fill="#222">após servir (1 tick)</text>

  <!-- Auto-laços -->
  <path d="M170,150 C150,95 260,95 240,150" fill="none" stroke="#777" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#seta)"/>
  <text x="205" y="92" text-anchor="middle" font-size="12" fill="#555">tempoNaMesa &lt; 2 (+1 por tick)</text>

  <path d="M580,150 C560,95 670,95 650,150" fill="none" stroke="#777" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#seta)"/>
  <text x="615" y="92" text-anchor="middle" font-size="12" fill="#555">sem prato no balcão</text>
</svg>
